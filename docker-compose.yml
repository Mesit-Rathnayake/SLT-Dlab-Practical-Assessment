version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medwizard_postgres
    environment:
      POSTGRES_USER: meduser
      POSTGRES_PASSWORD: medpassword
      POSTGRES_DB: medwizard_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meduser -d medwizard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
